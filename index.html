  <style>
    :root {
      --bg: #0f1226;
      --brand: #4F7CFF;
      --brand2: #8A5CFF;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: #fff; overflow: hidden;
    }
    /* 全屏 iframe 承载工作台 */
    #frame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; display: none; background: #fff;
    }
    #frame.show { display: block; }

    /* 启动遮罩（品牌闪屏） */
    #splash {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      background: radial-gradient(120% 120% at 50% 0%, #1b2150 0%, #0f1226 60%);
      transition: opacity .45s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .logo {
      width: 104px; height: 104px; border-radius: 24px;
      background: linear-gradient(145deg, var(--brand), var(--brand2));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 18px 40px rgba(79,124,255,.35);
    }
    #splash .logo svg { width: 58px; height: 58px; }
    #splash h1 { font-size: 22px; font-weight: 700; margin: 6px 0 0; letter-spacing: .5px; }
    #splash p { margin: 0; color: #9aa3c7; font-size: 13px; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.18); border-top-color: #fff;
      animation: spin .8s linear infinite; margin-top: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #openBtn {
      margin-top: 8px; padding: 12px 26px; border: 0; border-radius: 999px;
      font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 10px 24px rgba(79,124,255,.4); display: none;
    }
    #openBtn.show { display: inline-block; }

    /* 顶部悬浮工具条 */
    #bar {
      position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; z-index: 40;
      display: none; align-items: center; gap: 10px; padding: 8px 12px;
      background: linear-gradient(180deg, rgba(15,18,38,.92), rgba(15,18,38,0));
    }
    #bar.show { display: flex; }
    #bar .title { font-size: 14px; font-weight: 600; color: #fff; flex: 1; opacity: .92; }
    #bar button {
      border: 0; width: 38px; height: 38px; border-radius: 12px; cursor: pointer;
      background: rgba(255,255,255,.12); color: #fff; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
    }
    #bar button:active { background: rgba(255,255,255,.22); }

    /* 应用内“安装到桌面”横幅（捕获 beforeinstallprompt 后展示） */
    #installBar {
      position: fixed; left: 12px; right: 12px;
      bottom: calc(env(safe-area-inset-bottom,0) + 12px); z-index: 60;
      display: none; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 16px; background: rgba(20,24,52,.96);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 12px 30px rgba(0,0,0,.45); backdrop-filter: blur(8px);
    }
    #installBar.show { display: flex; }
    #installBar .txt { flex: 1; font-size: 13px; line-height: 1.4; color: #e8ebf7; }
    #installBar .txt b { color: #fff; }
    #installBar .go {
      border: 0; padding: 9px 16px; border-radius: 999px; cursor: pointer;
      font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
    }
    #installBar .no {
      border: 0; background: transparent; color: #9aa3c7; font-size: 18px;
      cursor: pointer; padding: 4px 8px; line-height: 1;
    }

    /* 加载失败提示 */
    #fallback {
      position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom,0) + 16px);
      z-index: 45; display: none; padding: 14px 16px; border-radius: 16px;
      background: rgba(20,24,52,.96); border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 12px 30px rgba(0,0,0,.4); font-size: 13px; line-height: 1.5;
    }
    #fallback.show { display: block; }
    #fallback a { color: #8ab0ff; word-break: break-all; }
  </style>
</head>
<body>
  <iframe id="frame" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="splash">
    <div class="logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="12" y="12" width="40" height="28" rx="5" fill="#fff"/>
        <rect x="17" y="18" width="22" height="5" rx="2.5" fill="#4F7CFF"/>
        <rect x="28" y="40" width="8" height="5" fill="#fff"/>
        <rect x="20" y="45" width="24" height="5" rx="2.5" fill="#fff"/>
      </svg>
    </div>
    <h1>个人生活台</h1>
    <p>WorkBuddy 资料库工作台</p>
    <div class="spinner" id="spinner"></div>
    <button id="openBtn">打开工作台</button>
  </div>

  <div id="bar">
    <div class="title">个人生活台</div>
    <button id="refreshBtn" title="刷新">↻</button>
    <button id="extBtn" title="在浏览器打开">↗</button>
  </div>

  <div id="fallback">
    工作台未能在应用内加载（可能因登录态或网络限制）。请点此
    <a id="fbLink" href="#" target="_blank" rel="noopener">在浏览器中打开</a>，
    登录后即可正常使用。
  </div>

  <!-- 安装到桌面横幅 -->
  <div id="installBar">
    <div class="txt">可把<b>个人生活台</b>安装到桌面，像 App 一样打开</div>
    <button class="go" id="installGo">安装</button>
    <button class="no" id="installNo" title="稍后">×</button>
  </div>

  <script>
    const SPACE_URL = "https://www.workbuddy.cn/space/d/bFuJ9NzcYiul6EUBKZNXmt";
    const splash = document.getElementById('splash');
    const spinner = document.getElementById('spinner');
    const openBtn = document.getElementById('openBtn');
    const frame = document.getElementById('frame');
    const bar = document.getElementById('bar');
    const fallback = document.getElementById('fallback');
    const fbLink = document.getElementById('fbLink');
    fbLink.href = SPACE_URL;

    let loaded = false;
    function reveal() {
      if (loaded) return;
      loaded = true;
      frame.classList.add('show');
      bar.classList.add('show');
      splash.classList.add('hide');
      setTimeout(() => splash.remove(), 500);
    }
    function showFallback() {
      spinner.style.display = 'none';
      openBtn.classList.add('show');
      fallback.classList.add('show');
    }

    function loadSpace() {
      frame.src = SPACE_URL;
    }

    // iframe 加载完成 -> 进入应用；超时(8s)未触发 -> 显示兜底
    frame.addEventListener('load', () => { reveal(); });
    const guard = setTimeout(showFallback, 8000);

    openBtn.addEventListener('click', () => { clearTimeout(guard); loadSpace(); });
    document.getElementById('refreshBtn').addEventListener('click', () => { frame.src = SPACE_URL; });
    document.getElementById('extBtn').addEventListener('click', () => window.open(SPACE_URL, '_blank', 'noopener'));

    // 启动即加载（首屏为品牌闪屏，加载完淡出）
    loadSpace();

    // 注册 Service Worker（实现可安装 + 离线闪屏）——尽早注册以满足安装条件
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // 捕获安装事件：即使浏览器不主动弹窗，也提供应用内“安装到桌面”按钮
    let deferredPrompt = null;
    const installBar = document.getElementById('installBar');
    const installGo = document.getElementById('installGo');
    const installNo = document.getElementById('installNo');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBar.classList.add('show');
    });
    installGo.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (_) {}
      deferredPrompt = null;
      installBar.classList.remove('show');
    });
    installNo.addEventListener('click', () => {
      deferredPrompt = null;
      installBar.classList.remove('show');
    });
    window.addEventListener('appinstalled', () => installBar.classList.remove('show'));
  </script>
</body>
</html>
